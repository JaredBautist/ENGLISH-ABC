name: aquilino-pedro-fortoul
services:
  aqd-pf-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MYSQL_DATABASE: aquilino_pedro_fortoul
      MYSQL_USER: aquilino_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=40", "--mysqlx=OFF"]
    volumes:
      - school_db:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
  aqd-pf-api:
    image: aquilino-pedro-fortoul-api:baseline
    build:
      context: ../..
      dockerfile: deploy/aquilino-pedro-fortoul/backend.Dockerfile
    restart: unless-stopped
    mem_limit: 192m
    environment:
      SECRET_KEY: ${SECRET_KEY:?required}
      DEBUG: "0"
      DB_HOST: aqd-pf-db
      DB_NAME: aquilino_pedro_fortoul
      DB_USER: aquilino_app
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_CONN_MAX_AGE: "30"
      ALLOWED_HOSTS: aquilino-duran-pedro-fortoul.162.35.28.193.nip.io,localhost
      CORS_ALLOWED_ORIGINS: http://aquilino-duran-pedro-fortoul.162.35.28.193.nip.io
      CSRF_TRUSTED_ORIGINS: http://aquilino-duran-pedro-fortoul.162.35.28.193.nip.io
    command: [gunicorn, "english_platform.wsgi:application", --bind, "0.0.0.0:8000", --workers, "1", --threads, "2", --timeout, "60", --access-logfile, "-"]
    depends_on:
      aqd-pf-db:
        condition: service_healthy
    volumes:
      - school_tts:/app/.tts_cache
    networks: [database, application]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),3).close()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  aqd-pf-web:
    image: aquilino-pedro-fortoul-web:baseline
    build:
      context: ../../frontend
      dockerfile: ../deploy/aquilino-pedro-fortoul/frontend.Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [application, gateway]
    depends_on:
      aqd-pf-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  database:
    internal: true
  application:
  gateway:
    external: true
    name: english-platform_default
volumes:
  school_db:
  school_tts:
