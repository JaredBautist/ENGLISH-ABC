# 1. Colegio Manuel Fernández de Novoa
server {
    listen 80;
    server_name manuel-fernandez-de-novoa.162.35.28.193.nip.io;

    client_max_body_size 50M;

    # API Backend -> Dedicated container for Manuel Fernández de Novoa
    location /api/ {
        proxy_pass http://backend-mfnovoa:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin for Manuel Fernández de Novoa
    location /django-admin/ {
        proxy_pass http://backend-mfnovoa:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend UI (React SPA)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Default Demo Platform (IP direct access & fallback)
