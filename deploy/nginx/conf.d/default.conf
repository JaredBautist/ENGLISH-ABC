# Configuración global de compresión Gzip para aceleración de transferencia
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

# 1. Colegio Manuel Fernández de Novoa
server {
    listen 80;
    server_name manuel-fernandez-de-novoa.162.35.28.193.nip.io;

    client_max_body_size 50M;

    # API Backend -> Dedicated container for Manuel Fernández de Novoa
    location /api/ {
        proxy_pass http://backend-mfnovoa:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin for Manuel Fernández de Novoa
    location /django-admin/ {
        proxy_pass http://backend-mfnovoa:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache agresivo en navegador para tarjetas e ilustraciones estáticas
    location ~* ^/(cards|topics|openmoji)/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host localhost;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Cache de scripts y estilos compilados
    location ~* \.(?:css|js)$ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host localhost;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Frontend UI (React SPA)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

